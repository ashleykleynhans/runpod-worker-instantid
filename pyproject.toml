[project]
name = "runpod-worker-instantid"
version = "0.0.0"
description = "RunPod Serverless Worker for InstantID"
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "numpy>=2.4.6",
    "Pillow>=12.3.0",
    "requests>=2.34.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
